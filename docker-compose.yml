# Workshop นี้รันผ่าน Docker เท่านั้น:  docker compose up --build
name: docs-agent-workshop

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      PDF_DIR: /data/pdfs
      CONTRACT_PATH: /contract/chat-response.json
    volumes:
      - ./backend:/app
      - ./data/pdfs:/data/pdfs:ro
      - ./contract:/contract:ro
    ports:
      - "8000:8000"
    extra_hosts:
      # ให้ container เรียก LLM ที่รันบนเครื่อง host ได้ผ่าน host.docker.internal (จำเป็นบน Linux)
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  frontend:
    build: ./frontend
    environment:
      # browser เป็นคนเรียก API จึงใช้ localhost ไม่ใช่ชื่อ service
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_data:
